<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anonymizer – Dashboard</title>
<style>
  :root {
    --bg: #0f1117; --panel: #181b23; --panel2: #1f2330; --border: #2a2f3e;
    --text: #e2e5ec; --muted: #8b91a3; --accent: #6ea8fe; --ok: #4ade80;
    --err: #f87171; --warn: #fbbf24; --orig: #f87171; --anon: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; }
  header .sub { color: var(--muted); font-size: 12px; }
  header button { margin-left: auto; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  header button:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: 420px 1fr; height: calc(100vh - 57px); }
  #list { overflow-y: auto; border-right: 1px solid var(--border); }
  .row { padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; gap: 10px; align-items: baseline; }
  .row:hover, .row.active { background: var(--panel); }
  .row .time { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row .model { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
  .badge.ent { background: #3b2f5e; color: #c4b5fd; }
  .badge.ok { background: #14351f; color: var(--ok); }
  .badge.error { background: #3c1a1a; color: var(--err); }
  .badge.pending { background: #3a3110; color: var(--warn); }
  #detail { overflow-y: auto; padding: 20px; }
  #detail .placeholder-msg { color: var(--muted); margin-top: 40px; text-align: center; }
  h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 22px 0 10px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .col h3 { font-size: 12px; margin-bottom: 6px; }
  .col.orig h3 { color: var(--orig); }
  .col.anon h3 { color: var(--anon); }
  .msg { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .msg .role { font-size: 11px; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
  .msg pre { white-space: pre-wrap; word-break: break-word; font: 13px/1.5 ui-monospace, monospace; max-height: 320px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  mark { background: #3b2f5e; color: #c4b5fd; border-radius: 3px; padding: 0 3px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>🛡️ Anonymizer</h1>
  <span class="sub">OpenWebUI → <b>Anonymizer</b> → OpenRouter</span>
  <button onclick="clearAll()">Log leeren</button>
</header>
<main>
  <div id="list"></div>
  <div id="detail"><p class="placeholder-msg">Request auswählen …</p></div>
</main>
<script>
const token = new URLSearchParams(location.search).get('token');
const q = token ? '?token=' + encodeURIComponent(token) : '';
let selected = null;

const esc = s => (s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl = s => esc(s).replace(/\[([A-Z_]+_\d+)\]/g, '<mark>[$1]</mark>');
const fmtTime = ts => new Date(ts * 1000).toLocaleString('de-CH');

async function loadList() {
  try {
    const r = await fetch('/api/requests' + q);
    if (!r.ok) return;
    const items = await r.json();
    document.getElementById('list').innerHTML = items.map(it => `
      <div class="row ${it.id === selected ? 'active' : ''}" onclick="show('${it.id}')">
        <span class="time">${fmtTime(it.ts)}</span>
        <span class="model">${esc(it.model || '?')}</span>
        <span class="badge ent">${it.entity_count} PII</span>
        <span class="badge ${it.status}">${it.status}${it.duration_ms ? ' · ' + (it.duration_ms/1000).toFixed(1) + 's' : ''}</span>
      </div>`).join('') || '<p class="empty" style="padding:16px">Noch keine Requests.</p>';
  } catch (e) {}
}

function msgs(body) {
  return (body?.messages || []).map(m => {
    let c = m.content;
    if (Array.isArray(c)) c = c.map(p => p.type === 'text' ? p.text : `[${p.type}]`).join('\n');
    return { role: m.role, content: c ?? '' };
  });
}

async function show(id) {
  selected = id;
  const r = await fetch('/api/requests/' + id + q);
  if (!r.ok) return;
  const d = await r.json();
  const o = msgs(d.original_body), a = msgs(d.anon_body);
  const rows = o.map((m, i) => [m, a[i] || {role: m.role, content: ''}]);
  document.getElementById('detail').innerHTML = `
    <div class="meta">${fmtTime(d.ts)} · ${esc(d.model || '?')} · ${d.stream ? 'stream' : 'non-stream'} ·
      Status: ${esc(d.status)}${d.duration_ms ? ' · ' + d.duration_ms + ' ms' : ''}</div>
    ${d.error ? `<div class="msg" style="border-color:var(--err)"><pre>${esc(d.error)}</pre></div>` : ''}

    <h2>Erkannte PII (${(d.entities || []).length})</h2>
    ${(d.entities || []).length ? `<table><tr><th>Typ</th><th>Original</th><th>Platzhalter</th><th>Score</th><th>Sprache</th></tr>
      ${d.entities.map(e => `<tr><td>${esc(e.type)}</td><td>${esc(e.original)}</td><td><mark>${esc(e.placeholder)}</mark></td><td>${e.score}</td><td>${esc(e.lang)}</td></tr>`).join('')}
    </table>` : '<p class="empty">Keine PII erkannt.</p>'}

    <h2>Anfrage: an Anonymizer (links) vs. an OpenRouter (rechts)</h2>
    <div class="cols">
      <div class="col orig"><h3>▶ Eingang (OpenWebUI, Original)</h3>
        ${rows.map(([m]) => `<div class="msg"><div class="role">${esc(m.role)}</div><pre>${esc(m.content)}</pre></div>`).join('')}
      </div>
      <div class="col anon"><h3>▶ Ausgang (an OpenRouter, anonymisiert)</h3>
        ${rows.map(([, m]) => `<div class="msg"><div class="role">${esc(m.role)}</div><pre>${hl(m.content)}</pre></div>`).join('')}
      </div>
    </div>

    <h2>Antwort</h2>
    <div class="cols">
      <div class="col anon"><h3>▶ Von OpenRouter (anonymisiert)</h3>
        <div class="msg"><pre>${hl(d.response_anon) || '<span class="empty">–</span>'}</pre></div></div>
      <div class="col orig"><h3>▶ An OpenWebUI (de-anonymisiert)</h3>
        <div class="msg"><pre>${esc(d.response_final) || '<span class="empty">–</span>'}</pre></div></div>
    </div>`;
  loadList();
}

async function clearAll() {
  if (!confirm('Alle Einträge löschen?')) return;
  await fetch('/api/requests' + q, { method: 'DELETE' });
  selected = null;
  document.getElementById('detail').innerHTML = '<p class="placeholder-msg">Request auswählen …</p>';
  loadList();
}

loadList();
setInterval(loadList, 3000);
</script>
</body>
</html>
